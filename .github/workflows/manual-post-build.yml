name: Build manual editorial posts
on:
  push:
    branches: [main]
    paths:
      - 'content/posts/*.json'
      - 'content/directory-records.json'
      - 'content/directory-details.json'
      - 'scripts/directories.py'
      - 'scripts/build.py'
      - 'scripts/news_sitemap.py'
      - 'scripts/site_ui.py'
      - 'scripts/news_config.py'
      - 'scripts/verticals.py'
      - 'scripts/expanded_hubs.py'
      - 'scripts/official_notices.py'
      - 'scripts/notice_details.py'
      - 'tests/test_notice_details.py'
      - 'tests/test_expansion.py'
      - 'scripts/news_hub.py'
      - 'content/official-exam-notices.json'
      - '.github/workflows/manual-post-build.yml'
permissions:
  contents: write
concurrency:
  group: globaltech-main-publish
  cancel-in-progress: false
jobs:
  build:
    if: ${{ true }} # Re-enabled by owner after validation; source and image checks remain enforced
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build latest source and publish generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/build.py
            git add dist/
            if git diff --cached --quiet; then
              echo "Site already up to date"
              exit 0
            fi
            git commit -m "Build site after manual editorial post"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent main update on attempt $attempt; retrying against latest branch"
            sleep $((attempt * 2))
          done
          echo "::error::Could not publish after eight safe rebuild attempts"
          exit 1
