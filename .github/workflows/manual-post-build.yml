name: Build manual editorial posts
on:
  push:
    branches: [main]
    paths:
      - 'content/posts/*.json'
      - 'scripts/build.py'
      - 'scripts/news_sitemap.py'
      - 'scripts/site_ui.py'
      - 'scripts/news_config.py'
      - 'scripts/verticals.py'
      - 'scripts/expanded_hubs.py'
      - 'scripts/official_notices.py'
      - 'tests/test_expansion.py'
      - 'scripts/news_hub.py'
      - 'content/official-exam-notices.json'
      - '.github/workflows/manual-post-build.yml'
permissions:
  contents: write
concurrency:
  group: globaltech-news
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/build.py
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if ! git diff --cached --quiet; then
            git commit -m "Build site after manual editorial post"
            # News automation may publish new articles while this job runs.
            # Regenerate the site against the latest main instead of rebasing
            # thousands of generated HTML files (which creates conflicts).
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              python scripts/build.py
              git add dist/
              if git diff --cached --quiet; then
                echo "Site already up to date"
                exit 0
              fi
              git commit -m "Build site after manual editorial post"
              if git push origin HEAD:main; then
                echo "Published latest site (attempt $attempt)"
                exit 0
              fi
              sleep 3
            done
            echo "::error::Could not publish after five attempts"
            exit 1
          fi
