name: Backfill authorized source photos for older news
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/image-backfill.yml'
      - 'scripts/generate_images.py'
      - 'content/approved-photo-sources.json'
      - 'content/photo-subjects.json'
  schedule:
    # Rotate through older image gaps every three hours, not just four times/day.
    - cron: '12 */3 * * *'
permissions:
  contents: write
concurrency:
  # Do not race the article collector while either job modifies image cursors.
  group: globaltech-news-publish
  # Explicit image-code fixes take priority; scheduled backfills remain serialized.
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  archive-images:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install optional public page renderer
        continue-on-error: true
        run: |
          pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Find publisher article images for old posts and sync progress
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
          ENABLE_PUBLIC_BROWSER_FALLBACK: '1'
          BROWSER_ATTEMPTS_PER_RUN: '12'
          IMAGE_BACKFILL_MODE: all
          MAX_LICENSED_PHOTOS_PER_RUN: '5000'
          IMAGE_BACKFILL_WORKERS: '8'
          IMAGE_BACKFILL_SECONDS: '900'
          IMAGE_BACKFILL_FORCE: ${{ github.event_name == 'push' && '1' || '0' }}
          MAX_NEW_IMAGES: '0'
          SITE_URL: https://globewiredaily.org
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Preserve original images and upgrade old Commons/AI stand-ins when a
          # matching publisher article image is available. Otherwise use the
          # labelled build.py editorial illustration without unrelated stock.
          IMAGE_BACKFILL_MODE=mixed ENABLE_PUBLIC_BROWSER_FALLBACK=0 python -m unittest discover -s tests -p 'test_*image*.py'
          python -u scripts/generate_images.py
          git add -A content/featured content/image-audit-status.json content/image-audit-archive.json
          if [ -f content/image-backfill-state.json ]; then
            git add -A content/image-backfill-state.json
          fi
          if git diff --cached --quiet; then
            echo "No archive photos or cursor updates to sync"
            exit 0
          fi

          git commit -m "Backfill original source photos for archived news posts"
          git stash push --include-untracked -m 'archive-photo-clean-working-tree' || true
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::Archive photo rebase conflict; no images overwritten"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Archived photo backfill progress synced"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Archive photo backfill could not sync; retry on next run"
          exit 1
      - name: Retain archive image diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-backfill-diagnostics
          path: |
            content/image-audit-status.json
            content/image-audit-archive.json
            content/image-backfill-state.json
