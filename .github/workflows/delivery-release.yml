name: R2 delivery release
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      target:
        description: Staging first; production requires protected environment approval
        type: choice
        options: [staging, production]
        default: staging
      exhaustive:
        description: Verify every public page, redirect and image (required for initial migration)
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['scripts/**', 'cloudflare/**', 'content/**', '.github/workflows/delivery-*.yml']
  workflow_run:
    workflows: ['GlobalTech Daily Auto News']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: globewire-delivery-release
  cancel-in-progress: false
jobs:
  release:
    # Automatic releases remain OFF until the owner approves the first migration.
    if: (github.event_name == 'pull_request' && github.event.label.name == 'r2-stage-approved' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' || (github.event_name != 'pull_request' && vars.DELIVERY_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'))
    environment: ${{ (inputs.target == 'production' || (github.event_name != 'workflow_dispatch' && github.event_name != 'pull_request' && vars.DELIVERY_ENABLED == 'true')) && 'cloudflare-production' || 'cloudflare-staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: globewire-media
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      DELIVERY_INITIAL_VERIFIED: ${{ vars.DELIVERY_INITIAL_VERIFIED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact required settings without exposing them
        run: |
          python - <<'PY'
          import os
          required=['CF_ACCOUNT_ID','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','CLOUDFLARE_API_TOKEN','CLOUDFLARE_PAGES_PROJECT']
          missing=[key for key in required if not os.environ.get(key)]
          if missing:raise SystemExit('Missing GitHub secrets/variables: '+', '.join(missing))
          PY
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt -r requirements-delivery.txt
      - uses: actions/cache/restore@v4
        with:
          path: build/previous-output-report.json
          key: delivery-counts-${{ github.run_id }}
          restore-keys: delivery-counts-
      - run: python scripts/check_output_policy.py
      - run: python scripts/build.py --render-only
      - run: python -m unittest discover -s tests
      - run: node --test tests/delivery-worker.test.mjs
      - run: python scripts/audit_built_seo.py build/rendered
      - run: python scripts/delivery_package.py
      - run: python scripts/verify_delivery.py
      - name: Upload only absent immutable objects and verify R2
        run: python scripts/r2_sync.py --upload
      - name: Stage and verify exact release
        env:
          EXHAUSTIVE: ${{ github.event_name == 'pull_request' && 'true' || inputs.exhaustive }}
        run: |
          args=()
          if [ "$EXHAUSTIVE" = 'true' ]; then args+=(--all-urls); fi
          python scripts/deploy_delivery.py "${args[@]}"
      - name: Authorized production promotion
        if: inputs.target == 'production' || (github.event_name != 'workflow_dispatch' && github.event_name != 'pull_request' && vars.DELIVERY_ENABLED == 'true')
        env:
          PRODUCTION_ROUTING_AUTHORIZED: 'true'
        run: python scripts/deploy_delivery.py --production
      - name: Summarize output growth and responsible generators
        if: always()
        run: |
          if test -f build/output-report.json; then python scripts/delivery_monitor.py; fi
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: build/previous-output-report.json
          key: delivery-counts-${{ github.run_id }}
      - name: Retain verification and rollback release identifier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-release-${{ github.run_id }}
          path: |
            build/rollback*.json
            build/r2-receipt.json
            build/delivery-verification.json
            build/output-report.json
          retention-days: 30

  access-check:
    if: github.event_name == 'pull_request' && github.event.label.name == 'r2-access-check' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'boto3>=1.35,<2'
      - name: Read-only credentials and bucket audit
        run: |
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error
          import boto3
          from botocore.config import Config
          required=['CF_ACCOUNT_ID','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','CLOUDFLARE_API_TOKEN','CLOUDFLARE_PAGES_PROJECT']
          missing=[key for key in required if not os.environ.get(key)]
          lines=['## Read-only Cloudflare access check','']
          for key in required:
              lines.append('- '+key+': '+('configured' if os.environ.get(key) else 'MISSING'))
          account=os.environ.get('CF_ACCOUNT_ID','')
          if account and not re.fullmatch('[a-fA-F0-9]{32}',account):
              raise SystemExit('Account ID format invalid; no requests made')
          if all(os.environ.get(key) for key in required[:3]):
              client=boto3.client('s3',endpoint_url='https://'+account+'.r2.cloudflarestorage.com',
                  aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
                  aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],region_name='auto',
                  config=Config(connect_timeout=5,read_timeout=20,retries={'total_max_attempts':2}))
              count=size=images=0
              try:
                  for index,page in enumerate(client.get_paginator('list_objects_v2').paginate(Bucket='globewire-media')):
                      if index>=100:raise ValueError('Read-only list budget reached')
                      for row in page.get('Contents',[]):
                          count+=1;size+=row['Size'];images+=row['Key'].startswith('images/')
                  lines+=['- R2 read access: verified','- Bucket objects: '+str(count),'- Bucket bytes: '+str(size),'- Existing image-prefix objects: '+str(images)]
              except Exception as exc:
                  # Never print request headers, credentials, signed URLs or complete exception payloads.
                  code=getattr(exc,'response',{}).get('Error',{}).get('Code',type(exc).__name__)
                  lines.append('- R2 read access: failed ('+str(code)+')')
          if account and os.environ.get('CLOUDFLARE_API_TOKEN'):
              request=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects',
                  headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:data=json.load(response)
                  if not data.get('success'):raise ValueError('API rejected access')
                  projects=data.get('result',[])
                  candidates=[p['name'] for p in projects if p.get('source',{}).get('config',{}).get('repo_name')=='globaltech-daily']
                  lines.append('- Pages read access: verified')
                  lines.append('- Matching Pages projects: '+(', '.join(candidates) or 'none'))
              except Exception as exc:
                  code=getattr(exc,'code',type(exc).__name__)
                  lines.append('- Pages read access: failed ('+str(code)+')')
          lines+=['','No uploads, deletes, deployments, route edits, or paid-plan changes were performed.',
                  'Account-wide free-tier usage and production routing are NOT verified by this access check.']
          text='\n'.join(lines)+'\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write(text)
          if missing:raise SystemExit('Deployment blocked. Missing settings: '+', '.join(missing))
          PY
