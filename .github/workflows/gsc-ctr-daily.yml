name: Search Console daily CTR report
on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * *'
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test analysis logic
        run: python -m unittest discover -s tests -p 'test_ctr_opportunities.py' -v
      - name: Fetch GSC and produce report without publishing
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_PROPERTY: sc-domain:globewiredaily.org
        run: python scripts/gsc_ctr_monitor.py
      - name: Upload report when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-ctr-report
          path: /tmp/gsc-ctr-report/
          if-no-files-found: ignore
          retention-days: 14
