name: Install five user-selected featured photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/install-gorakhpur-featured.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch original representative photos and convert to JPG
        run: |
          python -m pip install --quiet pillow requests
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import requests
          from PIL import Image
          base=Path('content/featured');base.mkdir(parents=True,exist_ok=True)
          items=[
            ('b4a213019f0c46ab8d','https://images.bhaskarassets.com/web2images/521/2025/07/03/ef8ff4b7-967f-4fb8-831b-31bc9e8dd72f_1751555626028.jpg'),
            ('b4a213029f0c46ab8d','https://images.bhaskarassets.com/web2images/521/2025/07/03/ef8ff4b7-967f-4fb8-831b-31bc9e8dd72f_1751555626028.jpg'),
            ('b4a213039f0c46ab8d','https://www.jagranimages.com/images/newimg/17112023/17_11_2023-chhath_in_gorakhpur_23582688_m.webp'),
            ('b4a213049f0c46ab8d','https://www.jagranimages.com/images/newimg/19112023/19_11_2023-gorakhpur_news_21_23583969.webp'),
            ('b4a213059f0c46ab8d','https://www.jagranimages.com/images/2025/10/26/article/image/C-496-1-GKP1564-517809-1761458064251.webp'),
          ]
          session=requests.Session();session.headers.update({'User-Agent':'Mozilla/5.0 (compatible; GlobeWireEditorial/1.0)','Referer':'https://www.google.com/'})
          failures=[]
          for ident,url in items:
            dest=base/(ident+'.jpg')
            if dest.exists() and dest.stat().st_size>2000:
              print('Existing',dest);continue
            try:
              response=session.get(url,timeout=25);response.raise_for_status()
              im=Image.open(BytesIO(response.content)).convert('RGB')
              if min(im.size)<100:raise ValueError('Unexpectedly small photo')
              im.save(dest,'JPEG',quality=87,optimize=True)
              print('Saved',dest,im.size)
            except Exception as exc:
              print('FAILED',ident,repr(exc));failures.append(ident)
          if failures:raise SystemExit('Images unavailable: '+','.join(failures))
          PY
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/featured/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add original user-selected Gorakhpur featured images"
            git push
          fi
