name: R2 images - manual backup
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload and verify images in R2 (false = dry run)'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/article-delivery-safe-preview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build and allow only known Pages file-count guard
        shell: bash
        run: |
          set +e
          python scripts/build.py > /tmp/r2-build.log 2>&1
          code=$?
          set -e
          tail -n 35 /tmp/r2-build.log
          if [ "$code" -ne 0 ]; then
            if ! grep -q 'safe threshold is 19000' /tmp/r2-build.log; then
              echo 'Build failed for an unexpected reason; refusing image backup.'
              exit "$code"
            fi
            echo 'Pages asset-count guard triggered after generating dist; backup may proceed, but deployment remains blocked.'
          fi
          test -d dist/images
      - name: Image manifest (no upload)
        run: python experiments/article-delivery/upload_images_r2.py --manifest /tmp/r2-image-manifest.json
      - name: Upload and verify images
        if: ${{ inputs.upload == true }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: globewire-media
        run: |
          pip install boto3
          python experiments/article-delivery/upload_images_r2.py --manifest /tmp/r2-image-manifest.json --upload --verify
      - name: Save image manifest
        uses: actions/upload-artifact@v4
        with:
          name: r2-image-manifest
          path: /tmp/r2-image-manifest.json
          retention-days: 7
