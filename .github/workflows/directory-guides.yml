name: Publish worldwide college and product guides
on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_directory_guides.py'
      - 'scripts/directory_facts.py'
      - 'scripts/directory_photos.py'
      - 'content/directory-details.json'
      - 'tests/test_directory_complete.py'
      - 'scripts/research_directory_sources.py'
      - 'scripts/refresh_directories.py'
      - 'scripts/public_page_fetch.py'
      - 'tests/test_directory_pipeline.py'
      - '.github/workflows/directory-guides.yml'
  schedule:
    - cron: '21 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: globaltech-directory-guides
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: /tmp/globewire-public-cache
          key: directory-fetch-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: directory-fetch-v2-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - name: Install optional public-page browser
        run: |
          pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Research official sources and prepare two guides per category
        env:
          ENABLE_PUBLIC_BROWSER_FALLBACK: '1'
          BROWSER_ATTEMPTS_PER_RUN: '12'
          DIRECTORY_RESEARCH_LIMIT: '120'
          DIRECTORY_RESEARCH_WORKERS: '4'
          DIRECTORY_PAGES_PER_RUN: '2'
          DIRECTORY_RESEARCH_SECONDS: ${{ github.event_name == 'push' && '240' || '480' }}
          DIRECTORY_DOMAINS_PER_ENTITY: '4'
          IMAGE_BACKFILL_MODE: directory
          MAX_LICENSED_PHOTOS_PER_RUN: '100'
          IMAGE_BACKFILL_WORKERS: '4'
          IMAGE_BACKFILL_SECONDS: '100'
          DIRECTORY_PHOTO_SECONDS: '120'
          DIRECTORY_PHOTO_LIMIT: '24'
          MAX_NEW_IMAGES: '0'
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m compileall -q scripts
          python -m unittest discover -s tests -p 'test_directory*.py' -v
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            python scripts/refresh_directories.py
            python scripts/research_directory_sources.py
          else
            echo 'Deploy verified profiles now; source discovery resumes on the next scheduled run.'
          fi
          # Retain research outside the checkout across concurrent-push retries.
          cp content/directory-details.json /tmp/directory-details.json
          cp content/directory-research-state.json /tmp/directory-research-state.json
          cp content/directory-research-status.json /tmp/directory-research-status.json
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git fetch origin main
              git reset --hard origin/main
              python -c "import json; from pathlib import Path; p=Path('content/directory-details.json'); current=json.loads(p.read_text()); saved=json.load(open('/tmp/directory-details.json')); [current.setdefault(k,{}).update(v) for k,v in saved.items()]; p.write_text(json.dumps(current,ensure_ascii=False,indent=2)+'\n')"
              python -c "import json; from pathlib import Path; p=Path('content/directory-research-state.json'); current=json.loads(p.read_text()) if p.exists() else {}; saved=json.load(open('/tmp/directory-research-state.json')); current.update({k:v for k,v in saved.items() if v.get('attempted',0)>=current.get(k,{}).get('attempted',0)}); p.write_text(json.dumps(current,indent=2)+'\n')"
              cp /tmp/directory-research-status.json content/directory-research-status.json
            fi
            python scripts/publish_directory_guides.py
            timeout 130s python -u scripts/directory_photos.py || echo '::warning::Remaining directory photos will retry next run'
            python scripts/generate_images.py
            python scripts/build.py
            git add content/posts/ content/directory-records.json content/directory-details.json content/directory-guide-status.json content/directory-*-state.json content/directory-research-status.json content/featured/ content/image-backfill-state.json content/image-audit-status.json content/image-audit-directory.json dist/
            if git diff --cached --quiet; then
              echo 'No new guides generated'
              exit 0
            fi
            git commit -m 'Publish verified directory guides and research cache'
            if git push origin HEAD:main; then
              python -c "import json; from pathlib import Path; d=json.loads(Path('content/directory-guide-status.json').read_text()); print('Directory guides published: {}/8; missing verified candidates: {}'.format(d.get('published',0),d.get('missing',{})))"
              if python -c "import json,sys; d=json.load(open('content/directory-guide-status.json')); sys.exit(0 if d.get('published',0)==0 else 1)"; then
                echo '::warning::No new directory guides published; source research or candidate completeness needs improvement.'
              fi
              echo 'Directory research cache and site build committed.'
              exit 0
            fi
            echo "Concurrent push, retry $attempt"
            sleep $((attempt * 2))
          done
          echo '::error::Unable to publish after three attempts'
          exit 1
      - name: Retain research and rejection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directory-diagnostics
          path: |
            content/directory-*-status.json
            content/directory-*-state.json
            content/directory-details.json
            content/directory-records.json
