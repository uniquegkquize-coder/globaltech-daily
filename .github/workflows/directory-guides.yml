name: Publish worldwide college and product guides
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: globaltech-directory-guides
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Research official sources and prepare two guides per category
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python -m py_compile scripts/publish_directory_guides.py
            python scripts/refresh_directories.py
            python scripts/research_directory_sources.py
            python scripts/publish_directory_guides.py
            git add content/posts/ content/directory-records.json content/directory-details.json
            if git diff --cached --quiet; then
              echo 'No new guides generated'
              exit 0
            fi
            git commit -m 'Publish two sourced directory guides'
            if git push origin HEAD:main; then
              echo 'Eight directory guides committed; site build will render pages.'
              exit 0
            fi
            echo "Concurrent push, retry $attempt"
            sleep $((attempt * 2))
          done
          echo '::error::Unable to publish after eight attempts'
          exit 1
