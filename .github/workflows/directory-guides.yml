name: Publish worldwide college and product guides
on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_directory_guides.py'
      - 'scripts/research_directory_sources.py'
      - 'scripts/refresh_directories.py'
      - '.github/workflows/directory-guides.yml'
  schedule:
    - cron: '21 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: globaltech-directory-guides
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install optional public-page browser
        run: |
          pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Research official sources and prepare two guides per category
        env:
          ENABLE_PUBLIC_BROWSER_FALLBACK: '1'
          BROWSER_ATTEMPTS_PER_RUN: '8'
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python -m py_compile scripts/publish_directory_guides.py scripts/research_directory_sources.py
            python scripts/refresh_directories.py
            python scripts/research_directory_sources.py
            python scripts/publish_directory_guides.py
            python scripts/build.py
            git add content/posts/ content/directory-records.json content/directory-details.json content/directory-guide-status.json dist/
            if git diff --cached --quiet; then
              echo 'No new guides generated'
              exit 0
            fi
            git commit -m 'Publish verified directory guides and research cache'
            if git push origin HEAD:main; then
              python - <<'PY'
              import json
              from pathlib import Path
              status=json.loads(Path('content/directory-guide-status.json').read_text())
              published=status.get('published',0)
              missing=status.get('missing',{})
              print(f'Directory guides published: {published}/8; missing verified candidates: {missing}')
              if published==0:
                  print('::warning::No new directory guides published; source research or candidate completeness needs improvement.')
              PY
              echo 'Directory research cache and site build committed.'
              exit 0
            fi
            echo "Concurrent push, retry $attempt"
            sleep $((attempt * 2))
          done
          echo '::error::Unable to publish after eight attempts'
          exit 1
