name: SEO recovery
on:
  pull_request:
    paths:
      - '.github/workflows/seo-recovery.yml'
      - 'scripts/**'
      - 'requirements.txt'
      - 'data/**'
      - 'tests/**'
      - 'content/posts/**'
      - 'content/featured/**'
      - 'content/published-url-inventory.json'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /requirements.txt
            /.github/
            /scripts/
            /tests/
            /experiments/
            /content/
            /data/
            /dist/404.html
            /dist/_headers
            /dist/_redirects
            /dist/ads.txt
            /dist/en/index.html
            /dist/news-sitemap.xml
            /dist/robots.txt
            /dist/sitemap.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests
      - name: Render with the Oracle build entry point
        run: python scripts/build.py --render-only
      - name: Verify generated pages, sitemaps and preserved routes
        run: |
          git ls-tree -r --name-only HEAD -- dist > "${RUNNER_TEMP}/seo-legacy-files.txt"
          python scripts/audit_built_seo.py build/rendered \
            --legacy-files "${RUNNER_TEMP}/seo-legacy-files.txt" \
            --inventory content/published-url-inventory.json \
            --report "${RUNNER_TEMP}/seo-build-audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-build-audit
          path: ${{ runner.temp }}/seo-build-audit.json
          if-no-files-found: ignore
          overwrite: true

  audit-live:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: globewire-seo-recovery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /content/posts/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3' 'google-auth>=2,<3' 'cryptography>=42'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/seo-recovery/checkpoint.json
          key: seo-recovery-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: seo-recovery-v1-
      - name: Audit production and Search Console
        env:
          SEO_GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.SEO_GSC_SERVICE_ACCOUNT_JSON }}
          SEO_GSC_REPORT_KEY: ${{ secrets.SEO_GSC_REPORT_KEY }}
        run: python scripts/seo_recovery.py --output "${RUNNER_TEMP}/seo-recovery"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/seo-recovery/checkpoint.json
          key: seo-recovery-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-live-audit
          path: |
            ${{ runner.temp }}/seo-recovery/audit.json
            ${{ runner.temp }}/seo-recovery/search-console.json.fernet
          if-no-files-found: ignore
          overwrite: true
