name: GlobalTech Daily Auto News
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3,9,15,21 * * *'
permissions:
  contents: write
concurrency:
  group: globaltech-news
  cancel-in-progress: false
jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q scripts
      - name: Validate newsroom configuration
        run: python -m unittest discover -s tests -p 'test_newsroom_config.py' -v
      - name: Generate source-based news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_POST: ${{ vars.AUTO_POST }}
          SITE_URL: https://globaltech-daily.pages.dev
          PYTHONUNBUFFERED: '1'
          POSTS_PER_RUN: '14'
          MAX_MODELS_PER_ARTICLE: '1'
          MAX_AI_CALLS_PER_RUN: '60'
          MIN_SOURCE_WORDS: '450'
          MIN_ARTICLE_WORDS: '800'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          AI_PROVIDER_ORDER: gemini,groq,openrouter,openai
          GEMINI_MODEL: gemini-2.5-flash
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: python -u scripts/collect.py
      - name: Generate original article featured images (best effort)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: gemini-2.5-flash-image
          MAX_NEW_IMAGES: '14'
        run: python -u scripts/generate_images.py
      - name: Build website
        env:
          SITE_URL: https://globaltech-daily.pages.dev
        run: |
          python -u scripts/build.py
          test -f dist/en/index.html
          test -f dist/hi/index.html
          test -f dist/sitemap.xml
          echo 'Website build finished'
      - name: Commit generated site and articles
        shell: bash
        run: |
          git config user.name 'GlobalTech News Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/posts content/pending dist
          if ! git diff --cached --quiet; then
            git commit -m 'Publish source-backed tech news and rebuild website'
            git push origin HEAD:${{ github.ref_name }}
          else
            echo 'No changes to commit'
          fi
