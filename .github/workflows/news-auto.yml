name: GlobalTech Daily Auto News
on:
  push:
    branches: [main]
    paths: ['.github/workflows/news-auto.yml']
  schedule:
    # Run every two hours, UTC.
    - cron: '7 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: globaltech-news-publish
  cancel-in-progress: false
jobs:
  archive-image-backfill:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate image extractor syntax
        run: python -m py_compile scripts/generate_images.py
      - name: Finish saved drafts in extended backlog batches
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          AUTO_POST: ${{ vars.AUTO_POST }}
          POSTS_PER_RUN: '100'
          MAX_AI_CALLS_PER_RUN: '100'
          COLLECT_SECONDS: '300'
          DISCOVERY_SECONDS: '35'
          MIN_SOURCE_WORDS: '0'
          MIN_ARTICLE_WORDS_EN: '140'
          MIN_ARTICLE_WORDS_HI: '90'
          QUEUE_MAX_AGE_HOURS: '87600'
          AI_PROVIDER_ORDER: gemini,openrouter,groq,openai
          MAX_MODELS_PER_ARTICLE: '5'
          GEMINI_MODEL: gemini-flash-lite-latest
          GROQ_MODEL: openai/gpt-oss-120b
          OPENAI_MODEL: gpt-4.1-mini
        run: |
          for pass in 1 2 3 4 5 6 7 8; do
            echo "Backlog publication pass $pass/8"
            python -u scripts/collect.py || echo "::warning::Draft pass $pass incomplete"
          done
      # Refresh all categories and audit remaining original-photo gaps after the archive-wide detection fix.
      - name: Scan all archived and fresh articles for publisher images
        env:
          MAX_LICENSED_PHOTOS_PER_RUN: '100000'
          MAX_NEW_IMAGES: '0'
          IMAGE_BACKFILL_MODE: mixed
        run: |
          python -u scripts/generate_images.py
          python -u scripts/build.py
      - name: Commit refreshed images and rebuilt pages
        run: |
          git config user.name 'GlobalTech News Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A content/posts content/pending content/featured content/news-run-status.json content/news-coverage-status.json content/image-backfill-state.json dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Backfill original source photos across archive'
          # The build may modify other tracked files. Stash them before rebasing.
          git stash push --include-untracked -m 'archive-backfill-working-tree-cleanup' || true
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
  publish-news:
    if: github.event_name != 'push' # Normal scheduled publisher; push performs one-time full archive backfill
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install optional public-page browser
        run: |
          pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Compile all Python files
        run: python -m compileall -q scripts
      # A single bounded batch per scheduled run: no idle sleeping or queued marathon runs.
      # Keep the existing 48 category routes and featured image provenance intact.
      - name: Publish news in short cycles
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_POST: ${{ vars.AUTO_POST }}
          SITE_URL: https://globewiredaily.org
          PYTHONUNBUFFERED: '1'
          ENABLE_PUBLIC_BROWSER_FALLBACK: '1'
          BROWSER_ATTEMPTS_PER_RUN: '6'
          NEWS_CATEGORY: ''
          POSTS_PER_RUN: '100'
          MIN_POSTS_PER_CATEGORY: '2'
          CATEGORY_PUBLISH_CAP: '0'
          MAX_MODELS_PER_ARTICLE: '5'
          MAX_AI_CALLS_PER_RUN: '100'
          COLLECT_SECONDS: '500'
          DISCOVERY_SECONDS: '90'
          QUEUE_MAX_AGE_HOURS: '87600'
          PUBLISHER_WEBSITES_PER_RUN: '32'
          MIN_SOURCE_WORDS: '0'
          MIN_ARTICLE_WORDS_EN: '140'
          MIN_ARTICLE_WORDS_HI: '90'
          MAX_LICENSED_PHOTOS_PER_RUN: '100'
          MAX_NEW_IMAGES: '0'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          AI_PROVIDER_ORDER: gemini,openrouter,groq,openai
          MAX_MODELS_PER_ARTICLE: '5'
          GEMINI_MODEL: gemini-flash-lite-latest
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          set -u
          git config user.name 'GlobalTech News Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "::group::Collect and complete bilingual news drafts"
          for pass in 1 2 3; do
            echo "Publishing pass $pass/3"
            if ! python -u scripts/collect.py; then
              echo "::warning::Collector pass $pass incomplete; drafts remain saved"
            fi
            # A provider-wide 429 cannot be fixed by immediately repeating the batch.
            if python -c "import json,sys;d=json.load(open('content/news-run-status.json'));sys.exit(0 if d.get('outcome')=='providers_unavailable' else 1)"; then
              echo "::warning::AI providers exhausted or rate-limited. Stop retries until the next scheduled run; check API quotas and keys."
              break
            fi
            if python -c "import sys;sys.path.insert(0,'scripts');from news_config import CATEGORIES;from collect import published_categories;c=published_categories();missing={k:c.get(k,0) for k in CATEGORIES if c.get(k,0)<2};print('CATEGORY_MINIMUM_AUDIT',missing);sys.exit(bool(missing))"; then
              echo "Every category has at least two published posts"
              break
            fi
          done
          echo "::endgroup::"

          # Locate the real picture published with the source article first,
          # including older posts. Store source/rights metadata. If unavailable,
          # build.py supplies an explicitly labelled editorial illustration.
          echo "::group::Find original source photos and preserve editorial fallbacks"
          python -u scripts/generate_images.py || echo "::warning::Optional photo lookup unavailable"
          echo "::endgroup::"

          python -u scripts/build.py || { echo "::error::Static-site build failed"; exit 1; }
          for output in dist/en/index.html dist/hi/index.html dist/sitemap.xml; do
            if ! test -s "$output"; then
              echo "::error::Required output is missing: $output"
              exit 1
            fi
          done

          git add -A content/posts content/pending content/featured content/news-run-status.json content/news-coverage-status.json dist
          if [ -f content/image-backfill-state.json ]; then git add -A content/image-backfill-state.json; fi
          if git diff --cached --quiet; then
            echo "No new completed posts, images or pending progress to sync"
            exit 0
          fi
          git commit -m "Publish verified bilingual news and featured images"
          git stash push --include-untracked -m "news-publisher-working-tree-cleanup" || true

          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::News publish rebase conflicted; keeping data in original commit for inspection"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published and synced bilingual news, pending progress and images"
              exit 0
            fi
            echo "::warning::Concurrent push detected; retrying on latest main ($attempt/4)"
            sleep 3
          done
          echo "::error::News generated but could not be synced safely after four attempts"
          exit 1

