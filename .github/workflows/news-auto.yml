name: GlobalTech Daily Auto News
on:
  push:
    branches: [main]
    paths: ['.github/workflows/news-auto.yml', 'scripts/collect.py', 'scripts/publish_news_batch.py', 'tests/test_batch_runtime.py', 'tests/test_publish_news_batch.py', 'tests/test_newsroom_config.py', 'scripts/authority_sources.py', 'scripts/authority_registry.py', 'tests/test_authority_sources.py']
  schedule:
    # Run every two hours, UTC.
    - cron: '7 */2 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Optional category (empty means all)'
        type: string
        default: ''
      posts:
        description: 'Total target across resumable passes'
        type: string
        default: '200'
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[publish-now]') && 'globaltech-news-validation' || 'globaltech-news-publish' }}
  cancel-in-progress: false
jobs:
  validate-publisher:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
  publish-news:
    # A deliberate [publish-now] commit is an auditable manual publishing trigger.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[publish-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install optional public-page browser package
        id: playwright-version
        run: |
          pip install 'playwright>=1.55,<2'
          python -c "from importlib.metadata import version; print('version=' + version('playwright'))" >> "$GITHUB_OUTPUT"
      - name: Restore public-page browser
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Install public-page browser system dependencies
        run: python -m playwright install-deps chromium
      - name: Download public-page browser on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium
      - name: Save public-page browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Restore trending drafts queued by the 4-hour discovery workflow
        uses: actions/cache/restore@v4
        with:
          path: .cache/trending-drafts
          key: trending-drafts-main-${{ github.run_id }}-${{ github.run_attempt }}
          # The discovery workflow saves drafts under the trending-watch-main- prefix.
          restore-keys: trending-watch-main-
      - name: Ingest trending drafts into the pending queue
        # Trending discovery never deploys on its own; its finished drafts
        # are applied here and shipped with the next 2-hour publishing run.
        run: python scripts/ingest_trending_drafts.py
      - name: Compile all Python files
        run: python -m compileall -q scripts
      # Resume one target for up to 105 minutes; temporary provider limits wait
      # inside the current pass so discovery need not restart after each 429.
      # Keep the existing 48 category routes and featured image provenance intact.
      - name: Publish news in short cycles
        id: publish
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APEX_GEMINI_KEY: ${{ secrets.APEX_GEMINI_KEY }}
          UNIQUE: ${{ secrets.UNIQUE }}
          VK6917434: ${{ secrets.VK6917434 }}
          AUTO_POST: ${{ vars.AUTO_POST }}
          SITE_URL: https://globewiredaily.org
          PYTHONUNBUFFERED: '1'
          ENABLE_PUBLIC_BROWSER_FALLBACK: '1'
          BROWSER_ATTEMPTS_PER_RUN: '6'
          NEWS_CATEGORY: ${{ inputs.category || (github.event_name == 'push' && contains(github.event.head_commit.message, '[local-news]') && 'india-news') || '' }}
          POSTS_PER_RUN: ${{ inputs.posts || (github.event_name == 'push' && contains(github.event.head_commit.message, '[local-news]') && '12') || '200' }}
          MIN_POSTS_PER_CATEGORY: '2'
          CATEGORY_PUBLISH_CAP: '0'
          MAX_MODELS_PER_ARTICLE: '5'
          MAX_AI_CALLS_PER_RUN: '100'
          COLLECT_SECONDS: '500'
          DISCOVERY_SECONDS: '90'
          QUEUE_MAX_AGE_HOURS: '72'
          PUBLISHER_WEBSITES_PER_RUN: '32'
          MIN_SOURCE_WORDS: '0'
          MIN_ARTICLE_WORDS_EN: '140'
          MIN_ARTICLE_WORDS_HI: '90'
          MAX_LICENSED_PHOTOS_PER_RUN: '200'
          IMAGE_BACKFILL_MODE: new
          IMAGE_BACKFILL_SECONDS: '150'
          ARTICLE_WORKERS: '1'
          AI_REQUEST_INTERVAL_SECONDS: '8'
          PUBLISH_MAX_PASSES: '40'
          PUBLISH_POSTS_PER_PASS: '20'
          PUBLISH_MAX_AI_CALLS: '1200'
          PUBLISH_BATCH_SECONDS: '6300'
          MAX_NEW_IMAGES: '0'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          GROQ_MODELS: openai/gpt-oss-120b,llama-3.3-70b-versatile,openai/gpt-oss-20b
          AI_PROVIDER_ORDER: gemini,groq,openrouter
          GEMINI_MODEL: gemini-flash-lite-latest
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          set -u
          git config user.name 'GlobalTech News Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "::group::Collect and complete bilingual news drafts"
          # Each pass resumes only the remaining part of this 200-post target.
          publish_result=0
          python -u scripts/publish_news_batch.py || publish_result=$?
          echo "publish_result=$publish_result" >> "$GITHUB_OUTPUT"
          if [ "$publish_result" -ne 0 ]; then
            echo "::warning::200-post target incomplete; retaining and syncing partial progress"
          fi
          echo "::endgroup::"

          python scripts/repair_categories.py --write

          # Locate the real picture published with the source article first,
          # including older posts. Store source/rights metadata. If unavailable,
          # build.py supplies an explicitly labelled editorial illustration.
          echo "::group::Find original source photos and preserve editorial fallbacks"
          python -u scripts/generate_images.py || echo "::warning::Optional photo lookup unavailable"
          echo "::endgroup::"


          git add -A content/posts content/pending content/featured content/news-run-status.json content/news-coverage-status.json
          if [ -f content/image-backfill-state.json ]; then git add -A content/image-backfill-state.json; fi
          if git diff --cached --quiet; then
            echo "No new completed posts, images or pending progress to sync"
            exit 0
          fi
          git commit -m "Publish verified bilingual news and featured images"
          git stash push --include-untracked -m "news-publisher-working-tree-cleanup" || true

          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::News publish rebase conflicted; keeping data in original commit for inspection"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published and synced bilingual news, pending progress and images"
              exit 0
            fi
            echo "::warning::Concurrent push detected; retrying on latest main ($attempt/4)"
            sleep 3
          done
          echo "::error::News generated but could not be synced safely after four attempts"
          exit 1

      - name: Report run outcome and category coverage
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = ['## GlobalTech Daily publish run']
          status_path = Path('content/news-run-status.json')
          if status_path.is_file():
              s = json.loads(status_path.read_text(encoding='utf-8'))
              lines += ['- Outcome: %s' % s.get('outcome'),
                        '- Published: %s of %s target' % (s.get('published'), s.get('target')),
                        '- AI calls: %s of %s' % (s.get('ai_calls'), s.get('ai_limit')),
                        '- Target shortfall: %s posts' % s.get('shortfall', max(0, s.get('target', 0)-s.get('published', 0)))]
              shortfalls=s.get('category_shortfalls') or {}
              if shortfalls:lines += ['- Per-run unmet category targets: '+', '.join('%s: missing %s' % kv for kv in sorted(shortfalls.items()))]
              by = s.get('by_category') or {}
              if by:
                  lines += ['- Per-category published: ' + ', '.join('%s=%s' % kv for kv in sorted(by.items()))]
              discovered = s.get('discovered_by_category') or {}
              zero = [c for c, n in discovered.items() if not n]
              if zero:
                  lines += ['- Categories with zero discovered leads this run: ' + ', '.join(sorted(zero))]
          coverage_path = Path('content/news-coverage-status.json')
          if coverage_path.is_file():
              c = json.loads(coverage_path.read_text(encoding='utf-8'))
              below = c.get('categories_below_minimum') or {}
              if below:
                  lines += ['- Historical categories below the 2-post minimum: ' + ', '.join('%s=%s' % kv for kv in sorted(below.items()))]
              providers = c.get('provider_status') or {}
              if providers.get('configured'):
                  lines += ['- AI providers configured: ' + ', '.join(providers['configured'])]
              if providers.get('cooldown'):
                  lines += ['- Providers cooling down: ' + ', '.join(providers['cooldown'])]
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as out:
                  out.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Check the full publishing target after saving progress
        if: steps.publish.outputs.publish_result != '' && steps.publish.outputs.publish_result != '0'
        run: |
          echo "::error::Publishing target was not reached. Partial articles and drafts were saved; see the run summary for provider limits and shortfall."
          exit 1
