name: GlobalTech Daily Auto News
on:
  push:
    branches: [main]
    paths: ['.github/workflows/news-auto.yml']
  schedule:
    # Run every two hours, UTC.
    - cron: '7 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: globaltech-news-publish
  cancel-in-progress: false
jobs:
  validate-publisher:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
  publish-news:
    # A deliberate [publish-now] commit is an auditable manual publishing trigger.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[publish-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install optional public-page browser
        run: |
          pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Restore trending drafts queued by the 4-hour discovery workflow
        uses: actions/cache/restore@v4
        with:
          path: .cache/trending-drafts
          key: trending-drafts-main-${{ github.run_id }}-${{ github.run_attempt }}
          # The discovery workflow saves drafts under the trending-watch-main- prefix.
          restore-keys: trending-watch-main-
      - name: Ingest trending drafts into the pending queue
        # Trending discovery never deploys on its own; its finished drafts
        # are applied here and shipped with the next 2-hour publishing run.
        run: python scripts/ingest_trending_drafts.py
      - name: Compile all Python files
        run: python -m compileall -q scripts
      # A single bounded batch per scheduled run: no idle sleeping or queued marathon runs.
      # Keep the existing 48 category routes and featured image provenance intact.
      - name: Publish news in short cycles
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_POST: ${{ vars.AUTO_POST }}
          SITE_URL: https://globewiredaily.org
          PYTHONUNBUFFERED: '1'
          ENABLE_PUBLIC_BROWSER_FALLBACK: '1'
          BROWSER_ATTEMPTS_PER_RUN: '6'
          NEWS_CATEGORY: ''
          POSTS_PER_RUN: '100'
          MIN_POSTS_PER_CATEGORY: '2'
          CATEGORY_PUBLISH_CAP: '0'
          MAX_MODELS_PER_ARTICLE: '5'
          MAX_AI_CALLS_PER_RUN: '100'
          COLLECT_SECONDS: '500'
          DISCOVERY_SECONDS: '90'
          QUEUE_MAX_AGE_HOURS: '72'
          PUBLISHER_WEBSITES_PER_RUN: '32'
          MIN_SOURCE_WORDS: '0'
          MIN_ARTICLE_WORDS_EN: '140'
          MIN_ARTICLE_WORDS_HI: '90'
          MAX_LICENSED_PHOTOS_PER_RUN: '100'
          IMAGE_BACKFILL_MODE: new
          IMAGE_BACKFILL_SECONDS: '150'
          ARTICLE_WORKERS: '5'
          MAX_NEW_IMAGES: '0'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          AI_PROVIDER_ORDER: gemini,openrouter,groq,openai
          GEMINI_MODEL: gemini-flash-lite-latest
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          set -u
          git config user.name 'GlobalTech News Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "::group::Collect and complete bilingual news drafts"
          # One bounded attempt toward the 100-post target. Saved drafts and
          # unused discoveries carry forward; never restart 100-post batches here.
          python -u scripts/collect.py || echo "::warning::Target incomplete; progress retained in news-run-status.json"
          echo "::endgroup::"

          # Locate the real picture published with the source article first,
          # including older posts. Store source/rights metadata. If unavailable,
          # build.py supplies an explicitly labelled editorial illustration.
          echo "::group::Find original source photos and preserve editorial fallbacks"
          python -u scripts/generate_images.py || echo "::warning::Optional photo lookup unavailable"
          echo "::endgroup::"

          python -u scripts/build.py || { echo "::error::Static-site build failed"; exit 1; }
          for output in dist/en/index.html dist/hi/index.html dist/sitemap.xml; do
            if ! test -s "$output"; then
              echo "::error::Required output is missing: $output"
              exit 1
            fi
          done

          git add -A content/posts content/pending content/featured content/news-run-status.json content/news-coverage-status.json dist
          if [ -f content/image-backfill-state.json ]; then git add -A content/image-backfill-state.json; fi
          if git diff --cached --quiet; then
            echo "No new completed posts, images or pending progress to sync"
            exit 0
          fi
          git commit -m "Publish verified bilingual news and featured images"
          git stash push --include-untracked -m "news-publisher-working-tree-cleanup" || true

          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::News publish rebase conflicted; keeping data in original commit for inspection"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published and synced bilingual news, pending progress and images"
              exit 0
            fi
            echo "::warning::Concurrent push detected; retrying on latest main ($attempt/4)"
            sleep 3
          done
          echo "::error::News generated but could not be synced safely after four attempts"
          exit 1

      - name: Report run outcome and category coverage
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = ['## GlobalTech Daily publish run']
          status_path = Path('content/news-run-status.json')
          if status_path.is_file():
              s = json.loads(status_path.read_text(encoding='utf-8'))
              lines += ['- Outcome: %s' % s.get('outcome'),
                        '- Published: %s of %s target' % (s.get('published'), s.get('target')),
                        '- AI calls: %s of %s' % (s.get('ai_calls'), s.get('ai_limit'))]
              by = s.get('by_category') or {}
              if by:
                  lines += ['- Per-category published: ' + ', '.join('%s=%s' % kv for kv in sorted(by.items()))]
              discovered = s.get('discovered_by_category') or {}
              zero = [c for c, n in discovered.items() if not n]
              if zero:
                  lines += ['- Categories with zero discovered leads this run: ' + ', '.join(sorted(zero))]
          coverage_path = Path('content/news-coverage-status.json')
          if coverage_path.is_file():
              c = json.loads(coverage_path.read_text(encoding='utf-8'))
              below = c.get('categories_below_minimum') or {}
              if below:
                  lines += ['- Historical categories below the 2-post minimum: ' + ', '.join('%s=%s' % kv for kv in sorted(below.items()))]
              providers = c.get('provider_status') or {}
              if providers.get('configured'):
                  lines += ['- AI providers configured: ' + ', '.join(providers['configured'])]
              if providers.get('cooldown'):
                  lines += ['- Providers cooling down: ' + ', '.join(providers['cooldown'])]
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as out:
                  out.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

