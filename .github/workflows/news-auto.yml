name: GlobalTech Daily Auto News
on:
  push:
    branches: [main]
    paths: ['scripts/news_config.py']
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: write
concurrency:
  group: globaltech-news
  cancel-in-progress: false
jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q scripts
      - name: Validate newsroom configuration
        run: python -m unittest discover -s tests -p 'test_newsroom_config.py' -v
      - name: Generate source-based news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_POST: ${{ vars.AUTO_POST }}
          SITE_URL: https://globewiredaily.org
          PYTHONUNBUFFERED: '1'
          POSTS_PER_RUN: '60'
          MIN_POSTS_PER_CATEGORY: '2'
          MAX_MODELS_PER_ARTICLE: '1'
          MAX_AI_CALLS_PER_RUN: '100'
          MIN_SOURCE_WORDS: '0'
          MIN_ARTICLE_WORDS_EN: '140'
          MIN_ARTICLE_WORDS_HI: '90'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          AI_PROVIDER_ORDER: gemini,groq,openrouter
          GEMINI_MODEL: gemini-2.5-flash
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: python -u scripts/collect.py
      - name: Generate original article featured images (best effort)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: gemini-2.5-flash-image
          MAX_NEW_IMAGES: '0'
        run: python -u scripts/generate_images.py
      - name: Build website
        env:
          SITE_URL: https://globewiredaily.org
        run: |
          python -u scripts/build.py
          test -f dist/en/index.html
          test -f dist/hi/index.html
          test -f dist/sitemap.xml
          echo 'Website build finished'
      - name: Commit generated site and articles
        shell: bash
        run: |
          git config user.name 'GlobalTech News Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A content/posts content/pending content/featured dist
          if ! git diff --cached --quiet; then
            git commit -m 'Publish source-backed tech news and rebuild website'
            # Sync new editorial posts with main without replaying generated HTML conflicts.
            # Rebuild all static pages on the current remote branch after syncing content.
            for attempt in 1 2 3 4 5; do
              git fetch origin "${{ github.ref_name }}"
              if ! git rebase -X theirs "origin/${{ github.ref_name }}"; then
                echo "Generated HTML conflicted with a concurrent publish; regenerating on latest main."
                git rebase --abort || true
                mkdir -p /tmp/news-publish-backup
                cp -a content/posts content/pending content/featured /tmp/news-publish-backup/
                git reset --hard "origin/${{ github.ref_name }}"
                cp -an /tmp/news-publish-backup/posts/. content/posts/ || true
                cp -an /tmp/news-publish-backup/pending/. content/pending/ || true
                cp -an /tmp/news-publish-backup/featured/. content/featured/ || true
                python -u scripts/build.py
                git add -A content/posts content/pending content/featured dist
                if ! git diff --cached --quiet; then
                  git commit -m 'Refresh generated site on latest main'
                fi
              fi
              if git push origin "HEAD:${{ github.ref_name }}"; then
                echo "Published generated site after sync (attempt $attempt)"
                exit 0
              fi
              sleep 3
            done
            echo "::error::Unable to publish after five safe sync attempts."
            exit 1
          else
            echo 'No changes to commit'
          fi
