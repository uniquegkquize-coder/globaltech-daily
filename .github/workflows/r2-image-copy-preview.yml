name: R2 image copy (manual only)
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Set true to upload images; default dry run'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  image-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: pip install -r requirements.txt
      - name: Build site
        run: python scripts/build.py
      - name: Dry-run manifest
        run: python experiments/article-delivery/upload_images_r2.py
      - name: Upload and verify (explicit opt-in)
        if: ${{ inputs.upload == true }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: globewire-media
        run: |
          pip install boto3
          python experiments/article-delivery/upload_images_r2.py --upload --verify
