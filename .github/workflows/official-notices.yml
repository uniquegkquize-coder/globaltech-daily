name: Official notice index
on:
  schedule:
    - cron: '13,28,43,58 * * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/official_notices.py', 'scripts/notice_details.py', '.github/workflows/official-notices.yml']
permissions:
  contents: write
concurrency:
  group: official-notice-index
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ true }} # Re-enabled by owner after validation; source and image checks remain enforced
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official document readers
        run: python -m pip install requests beautifulsoup4 'pypdf>=5,<7'
      - name: Check official boards
        run: python scripts/official_notices.py
      - name: Read bounded official notice details
        run: python scripts/notice_details.py ${{ github.event_name == 'push' && '200' || '24' }}
      - name: Publish new notice records
        run: |
          # Ignore refresh timestamps and transient fetch statuses when the published facts did not change.
          # A timestamp-only refresh must not rebuild thousands of pages or trigger Cloudflare.
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          paths = ('content/official-notice-archive.json', 'content/official-notice-details.json')
          volatile = {'checked_at', 'facts_checked_at', 'last_fetch_status', 'status', 'reason'}
          def stable(value):
              if isinstance(value, dict):
                  return {k: stable(v) for k, v in value.items() if k not in volatile}
              if isinstance(value, list):
                  return [stable(v) for v in value]
              return value

          changed = False
          for path in paths:
              try:
                  previous = json.loads(subprocess.check_output(['git', 'show', f'HEAD:{path}'], text=True))
              except (subprocess.CalledProcessError, ValueError):
                  previous = None
              current = json.loads(Path(path).read_text())
              if stable(previous) != stable(current):
                  changed = True
                  print(f'Published notice content changed: {path}')
          if not changed:
              print('No new or changed notice facts; skipping build, commit and deployment.')
              Path('/tmp/official-notices-noop').touch()
          PY
          if test -f /tmp/official-notices-noop; then exit 0; fi
          if git diff --quiet -- content/official-notice-archive.json content/official-notice-details.json; then exit 0; fi
          cp content/official-notice-archive.json /tmp/official-notices.json
          cp content/official-notice-details.json /tmp/official-notice-details.json
          python -m pip install Pillow
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/official_notices.py --merge /tmp/official-notices.json
            python scripts/notice_details.py --merge /tmp/official-notice-details.json
            if git diff --quiet -- content/official-notice-archive.json content/official-notice-details.json; then exit 0; fi
            git add content/official-notice-archive.json content/official-notice-details.json
            git commit -m 'Update official notice index and archive'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
