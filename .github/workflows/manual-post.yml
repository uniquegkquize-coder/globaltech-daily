name: GlobeWire Manual Post
on:
  workflow_dispatch:
    inputs:
      article:
        description: English article text, or the full submission copied from the GlobeWire editor
        required: true
        type: string
      en_title:
        description: English headline (fill when typing the article here)
        type: string
      category:
        description: Optional category slug. Leave blank to choose automatically from the article.
        type: string
      hi_title:
        description: Hindi headline (optional)
        type: string
      hi_body:
        description: Hindi article (optional)
        type: string
      source:
        description: Source HTTPS link (optional for original reporting)
        type: string
      image_url:
        description: Direct HTTPS photo link (optional)
        type: string
      image_upload:
        description: Filename uploaded to content/manual-uploads on main, e.g. photo.jpg
        type: string
      image_credit:
        description: Photo credit (required with any photo)
        type: string
      image_license:
        description: Photo permission or license (required with any photo)
        type: string
      mode:
        description: Check or publish
        type: choice
        options: [check, publish]
        default: check
        required: true

permissions:
  contents: write

jobs:
  manual-post:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            scripts
            content/posts
            content/featured
            content/manual-uploads
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photo importer dependencies
        run: pip install 'requests>=2.31,<3' 'Pillow>=10,<13'
      - name: Validate and save the article
        env:
          POST_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          submission="$RUNNER_TEMP/globewire-post.json"
          jq -e '
            .inputs as $input
            | ($input.article | try fromjson catch null) as $copied
            | (if ($copied | type) == "object" and ($copied | has("en_body")) then $copied
               else {en_body: $input.article} end)
            + ($input | {en_title, category, hi_title, hi_body, source, image_url, image_upload, image_credit, image_license}
               | with_entries(select(.value != null and .value != "")))
          ' "$GITHUB_EVENT_PATH" > "$submission"
          if [ "$POST_MODE" = check ]; then
            python scripts/manual_post.py "$submission" --check
            exit 0
          fi
          git config user.name 'GlobeWire Editorial Desk'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            result="$RUNNER_TEMP/globewire-post-summary.md"
            : > "$result"
            if ! GITHUB_STEP_SUMMARY="$result" python scripts/manual_post.py "$submission"; then
              cat "$result" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            git add -- content/posts content/featured
            if git diff --cached --quiet; then
              cat "$result" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git commit -m 'Publish manually submitted GlobeWire article'
            if git push origin HEAD:main; then
              cat "$result" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep "$attempt"
          done
          echo 'Could not sync with main. Run this submission again.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
