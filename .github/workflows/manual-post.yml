name: GlobeWire Manual Post
on:
  workflow_dispatch:
    inputs:
      article:
        description: Article in English or Hindi, or paste a copied editor submission
        type: string
      en_title:
        description: Title in the same language as article (leave blank when using Hindi fields below)
        type: string
      category:
        description: Optional category slug. Leave blank to choose automatically from the article.
        type: string
      hi_title:
        description: Hindi headline (optional)
        type: string
      hi_body:
        description: Hindi article (optional)
        type: string
      source:
        description: Source HTTPS link (optional for original reporting)
        type: string
      image_url:
        description: Direct HTTPS photo link (optional)
        type: string
      image_upload:
        description: Filename uploaded to content/manual-uploads on main, e.g. photo.jpg
        type: string
      image_credit:
        description: Photo credit (required with any photo)
        type: string
      image_license:
        description: Photo permission or license (required with any photo)
        type: string
      mode:
        description: Check or publish
        type: choice
        options: [check, publish]
        default: check
        required: true

permissions:
  contents: write

jobs:
  manual-post:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            scripts
            content/posts
            content/featured
            content/manual-uploads
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publisher dependencies
        run: pip install -r requirements.txt
      - name: Validate and save the article
        env:
          POST_MODE: ${{ inputs.mode }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APEX_GEMINI_KEY: ${{ secrets.APEX_GEMINI_KEY }}
          UNIQUE: ${{ secrets.UNIQUE }}
          VK6917434: ${{ secrets.VK6917434 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_PROVIDER_ORDER: gemini,groq,openrouter
          GEMINI_MODEL: gemini-flash-lite-latest
          MAX_MODELS_PER_ARTICLE: '2'
          MAX_AI_CALLS_PER_RUN: '12'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/globewire-input.json"
          submission="$RUNNER_TEMP/globewire-post.json"
          jq -e '
            .inputs as $input
            | (($input.article // "") | try fromjson catch null) as $copied
            | (if ($copied | type) == "object" and ($copied | has("en_body")) then $copied
               else {en_body: ($input.article // "")} end)
            + ($input | {en_title, category, hi_title, hi_body, source, image_url, image_upload, image_credit, image_license}
               | with_entries(select(.value != null and .value != "")))
          ' "$GITHUB_EVENT_PATH" > "$input"
          PYTHONPATH=scripts python - "$input" "$submission" <<'PYTHON'
          import os
          import sys
          from manual_translation import prepare_file

          try:
              prepare_file(*sys.argv[1:])
          except ValueError as error:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(f'## Submission stopped\n\n{error}\n')
              sys.exit(str(error))
          PYTHON
          if [ "$POST_MODE" = check ]; then
            python scripts/manual_post.py "$submission" --check
            exit 0
          fi
          git config user.name 'GlobeWire Editorial Desk'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            result="$RUNNER_TEMP/globewire-post-summary.md"
            : > "$result"
            if ! GITHUB_STEP_SUMMARY="$result" python scripts/manual_post.py "$submission"; then
              cat "$result" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            git add -- content/posts content/featured
            if git diff --cached --quiet; then
              cat "$result" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git commit -m 'Publish manually submitted GlobeWire article'
            if git push origin HEAD:main; then
              cat "$result" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep "$attempt"
          done
          echo 'Could not sync with main. Run this submission again.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
