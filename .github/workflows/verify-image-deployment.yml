name: Verify deployed real photographs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-image-deployment.yml']
  workflow_run:
    workflows: ['Backfill authorized source photos for older news']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: live-image-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - name: Verify production page, photo bytes, credits and social metadata
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, io, json, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          import sys
          sys.path.insert(0,'scripts')
          from image_rules import pipeline_fingerprint
          from bs4 import BeautifulSoup
          from PIL import Image
          
          root=Path('.')
          from image_rules import saved_photo_allowed
          pages=list(Path('dist/en/news').glob('*/*/index.html'))
          published={p.parent.name.rsplit('-',1)[-1]:p for p in pages}
          ids=[]
          for metadata_path in Path('content/featured').glob('*.json'):
              try:metadata=json.loads(metadata_path.read_text())
              except (OSError,ValueError):continue
              if not isinstance(metadata,dict):continue
              ident=metadata.get('post_id') or metadata_path.stem
              if (metadata.get('kind') in ('licensed_photo','publisher_source','source_original','manual_original','licensed_source')
                  and saved_photo_allowed(metadata,root) and ident[:10] in published
                  and (Path('content/featured')/(ident+'.jpg')).is_file()):
                  ids.append(ident)
          # Bound live requests; prioritize recently saved photos. Local build checks all posts.
          ids=sorted(set(ids),key=lambda i:(Path('content/featured')/(i+'.json')).stat().st_mtime,reverse=True)[:80]
          assert ids, 'No published photographs available to verify'
          def verify(ident):
              meta=json.loads((root/'content/featured'/f'{ident}.json').read_text())
              expected=(root/'content/featured'/f'{ident}.jpg').read_bytes()
              digest=hashlib.sha256(expected).hexdigest()
              path=next(p for p in pages if p.parent.name.endswith('-'+ident[:10]))
              local=BeautifulSoup(path.read_text(),'html.parser')
              canonical=local.select_one('link[rel="canonical"]')['href']
              response=requests.get(canonical,timeout=(5,20))
              response.raise_for_status()
              soup=BeautifulSoup(response.content,'html.parser')
              hero=soup.select_one('img.hero')
              assert hero and hero.get('alt') and hero.get('width')=='1280' and hero.get('height')=='720', 'hero attributes'
              social=soup.select_one('meta[property="og:image"]')
              assert social, 'missing social image'
              image_url=urljoin(canonical,hero['src'])
              assert social['content']==image_url, 'hero/social image mismatch'
              photo=requests.get(image_url,timeout=(5,20))
              photo.raise_for_status()
              assert hashlib.sha256(photo.content).hexdigest()==digest, 'deployment image bytes stale'
              with Image.open(io.BytesIO(photo.content)) as image:
                  assert image.format=='JPEG' and image.size==(1280,720), 'invalid dimensions/format'
              assert meta['source_image'] in [a.get('href') for a in soup.select('a[href]')], 'source credit missing'
              assert meta.get('license_name','') in soup.get_text(' ',strip=True), 'license missing'
              return dict(id=ident,url=canonical,image=image_url,sha256=digest,license=meta.get('license_name'),status='verified')
          pending=ids[:]; verified=[]; errors={}
          expected_pipeline=pipeline_fingerprint(root)
          for attempt in range(1,26):
              try:
                  marker=requests.get('https://globewiredaily.org/deployment.json',timeout=(5,20))
                  marker.raise_for_status()
                  assert marker.json().get('image_pipeline')==expected_pipeline, 'production image pipeline is stale'
                  print('LIVE_PIPELINE_VERIFIED',expected_pipeline,flush=True)
              except (requests.RequestException,ValueError,AssertionError) as exc:
                  if isinstance(exc,requests.HTTPError) and exc.response.status_code in (401,403,407,429,451):raise
                  errors.update({ident:'deployment marker: '+str(exc) for ident in pending})
                  print('DEPLOYMENT_MARKER_PENDING',type(exc).__name__,str(exc),flush=True)
                  if attempt<25:time.sleep(30)
                  continue
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                  futures={pool.submit(verify,ident):ident for ident in pending}
                  for future in concurrent.futures.as_completed(futures):
                      ident=futures[future]
                      try:
                          row=future.result();verified.append(row);pending.remove(ident)
                          print('LIVE_IMAGE_VERIFIED',json.dumps(row),flush=True)
                      except Exception as exc:
                          errors[ident]=str(exc)
                          print('DEPLOYMENT_PENDING',ident,type(exc).__name__,str(exc),flush=True)
                          if isinstance(exc,requests.HTTPError) and exc.response.status_code in (401,403,407,429,451):
                              raise
              if not pending:break
              if attempt<25:time.sleep(30)
          Path('live-image-verification.json').write_text(json.dumps(dict(verified=verified,pending=pending,errors={i:errors[i] for i in pending}),indent=2))
          assert not pending, 'Live verification failed: '+json.dumps({i:errors[i] for i in pending})
          print('LIVE_IMAGE_VERIFICATION_SUCCESS',len(verified),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-image-verification
          path: live-image-verification.json
