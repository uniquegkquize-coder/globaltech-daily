name: News source validation
on:
  push:
    paths:
      - 'content/posts/*.json'
      - 'scripts/collect.py'
      - 'scripts/public_page_fetch.py'
      - 'scripts/research_directory_sources.py'
      - 'scripts/test_sources.py'
      - 'scripts/build.py'
      - 'scripts/article_layout.py'
      - 'scripts/publish_directory_guides.py'
      - 'tests/test_article_layout.py'
      - 'scripts/seo_site.py'
      - 'scripts/seo_text.py'
      - 'scripts/audit_built_seo.py'
      - 'tests/test_site_seo.py'
      - 'scripts/directories.py'
      - 'scripts/refresh_directories.py'
      - 'content/directory-records.json'
      - 'content/directory-details.json'
      - 'scripts/news_sitemap.py'
      - 'scripts/site_ui.py'
      - 'scripts/news_config.py'
      - 'scripts/focused_sources.py'
      - 'scripts/probe_sources.py'
      - 'tests/test_source_pipeline.py'
      - 'tests/test_newsroom_config.py'
      - '.github/workflows/news-auto.yml'
      - 'tests/test_batch_runtime.py'
      - 'tests/test_image_requests.py'
      - 'scripts/generate_images.py'
      - 'scripts/verticals.py'
      - 'scripts/expanded_hubs.py'
      - 'scripts/official_notices.py'
      - 'scripts/notice_details.py'
      - 'tests/test_notice_details.py'
      - 'tests/test_expansion.py'
      - 'scripts/news_hub.py'
      - 'tests/test_news_priority.py'
      - 'content/official-exam-notices.json'
      - 'tests/test_news_sitemap.py'
      - '.github/workflows/news-source-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPYCACHEPREFIX: /tmp/globewire-validation-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile scripts/collect.py scripts/build.py scripts/directories.py scripts/refresh_directories.py scripts/test_sources.py
      - name: Install source parser dependencies
        run: python -m pip install requests feedparser beautifulsoup4 Pillow 'pypdf>=5,<7'
      - name: Test newsroom configuration and news sitemap boundaries
        run: python -m unittest discover -s tests -v
      - name: Probe worldwide launch sources without AI
        run: python -u scripts/probe_sources.py
      - name: Check state and city source coverage
        run: python scripts/test_sources.py
      - name: Prepare the Oracle build snapshot
        env:
          ORACLE_MIGRATION: e19ff8aa03bb1237450d77493466739cca6c4ca7
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          if ! git cat-file -e "$ORACLE_MIGRATION^{commit}"; then
            git fetch origin "$ORACLE_MIGRATION"
          fi
          git -c user.name=GlobeWire-CI -c user.email=ci@globewiredaily.org merge --no-edit "$ORACLE_MIGRATION"
      - name: Verify SEO sitemap and news sitemap generation
        run: |
          python scripts/build.py --render-only
          python scripts/audit_built_seo.py build/rendered
          test -s build/rendered/index.html
          test -s build/rendered/robots.txt
          test -s build/rendered/sitemap.xml
          test -s build/rendered/news-sitemap.xml
          test -s build/rendered/_headers
          grep -q 'Sitemap: https://globewiredaily.org/sitemap.xml' build/rendered/robots.txt
          grep -Eq 'urlset|sitemapindex' build/rendered/sitemap.xml
          grep -Eq 'news:news|sitemapindex' build/rendered/news-sitemap.xml || echo 'No news younger than 48 hours; empty news sitemap is permitted'
