name: CTR audit (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '21 5 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run CTR regression tests
        run: python -m unittest discover -s tests -p 'test_ctr_opportunities.py' -v
      - name: Analyze CSV export if present
        shell: bash
        run: |
          if test -f reports/gsc-page-query.csv; then
            python scripts/ctr_opportunities.py reports/gsc-page-query.csv --output /tmp/ctr-opportunities.json
          else
            echo 'No GSC CSV export. No Search Console API credentials configured.'
            echo 'Skipping report; no build, commit or Cloudflare deployment.'
          fi
