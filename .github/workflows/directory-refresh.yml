name: Refresh worldwide directory records (no news publishing)
on:
  push:
    branches: [main]
    paths: ['scripts/refresh_directories.py', '.github/workflows/directory-refresh.yml']
  workflow_dispatch:
  schedule:
    - cron: '32 */6 * * *'
permissions:
  contents: write
concurrency:
  group: worldwide-directory-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Refresh structured directory records
        run: python scripts/refresh_directories.py
      - name: Commit directory cache only (no publishing)
        run: |
          git add content/directory-records.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh worldwide directory reference records'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            python scripts/refresh_directories.py
            git add content/directory-records.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh worldwide directory reference records'
          done
          exit 1
