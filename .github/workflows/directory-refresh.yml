name: Refresh worldwide directory records (no news publishing)
on:
  push:
    branches: [main]
    paths: ['scripts/refresh_directories.py', '.github/workflows/directory-refresh.yml']
  workflow_dispatch:
  schedule:
    - cron: '32 3 * * 0'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Refresh structured directory records
        run: python scripts/refresh_directories.py
      - name: Commit directory cache only (no publishing)
        run: |
          if git diff --quiet -- content/directory-records.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/directory-records.json
          git commit -m 'Refresh worldwide directory reference records'
          git pull --rebase origin main
          git push origin HEAD:main
