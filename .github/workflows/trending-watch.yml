name: Trending Watch - fresh developments
on:
  schedule:
    # Trending discovery runs every 4 hours. It only queues drafts; the
    # 2-hour publishing workflow ingests them and triggers deployments.
    - cron: '23 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/trending_watch.py'
      - 'tests/test_trending_watch.py'
      - '.github/workflows/trending-watch.yml'
permissions:
  contents: write
concurrency:
  # Serialize article writes with the regular 100-post publisher and image repair.
  group: globaltech-news-publish
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
      TREND_STATE_PATH: .cache/trending/state.json
      TREND_POSTS_PER_RUN: '2'
      TREND_QUEUE_MODE: '1'
      MAX_AI_CALLS_PER_RUN: '6'
      MAX_MODELS_PER_ARTICLE: '2'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_PROVIDER_ORDER: gemini,openrouter,groq,openai
      GEMINI_MODEL: gemini-flash-lite-latest
      GROQ_MODEL: openai/gpt-oss-120b
      OPENAI_MODEL: gpt-4.1-mini
      SITE_URL: https://globewiredaily.org
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test the trend detector before enabling changed code
        if: github.event_name == 'push'
        # Isolate production AI budgets from offline test expectations.
        run: MAX_AI_CALLS_PER_RUN=100 MAX_MODELS_PER_ARTICLE=5 python -m unittest discover -s tests
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache/trending
            .cache/trending-drafts
          key: trending-watch-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: trending-watch-main-
      - name: Check fresh coverage and publish only material developments
        id: scan
        run: |
          python -u scripts/trending_watch.py
          python - <<'PY'
          import json,os
          report=json.load(open('content/trending-watch-status.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('changed='+('true' if report['changed_ids'] else 'false')+'\n')
          PY
      - name: Fetch original source photos for changed articles
        # Queue mode: drafts are not live posts yet; the publishing
        # workflow's image pipeline attaches photos at publish time.
        if: steps.scan.outputs.changed == 'true' && env.TREND_QUEUE_MODE != '1'
        # Never let an image CDN prevent completed text from being saved.
        continue-on-error: true
        run: timeout 60s python -u scripts/trending_watch.py --photos
      - name: Queue trending drafts for the next publishing cycle
        if: steps.scan.outputs.changed == 'true'
        # Queue mode: finished drafts stay in .cache/trending-drafts for the
        # 2-hour publishing workflow to ingest, build and deploy. No git
        # commit, no site build and no Cloudflare deployment from trending
        # discovery alone.
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('.cache/trending-drafts')
          drafts=sorted(d.glob('*.json')) if d.is_dir() else []
          print('Trending drafts queued for the publishing workflow:',len(drafts))
          for p in drafts:
              try:post=json.loads(p.read_text(encoding='utf-8'))
              except (OSError,ValueError):continue
              print('-',post.get('id'),(post.get('en_title') or '')[:70])
          PY
      - name: Persist detector signatures, provider backoff and queued drafts
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/trending
            .cache/trending-drafts
          key: trending-watch-main-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain detection diagnostics without redeploying on empty checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trending-watch-diagnostics
          path: content/trending-watch-status.json
          retention-days: 7
