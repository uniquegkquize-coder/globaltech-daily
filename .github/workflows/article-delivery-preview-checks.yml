name: Article delivery preview checks
on:
  push:
    branches:
      - experiment/article-delivery-safe-preview
  pull_request:
    paths:
      - 'experiments/article-delivery/**'
      - '.github/workflows/article-delivery-preview-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python unit tests
        run: python -m unittest discover -s experiments/article-delivery -p 'test_*.py' -v
      - name: Python compile check
        run: python -m py_compile experiments/article-delivery/upload_r2.py
      - name: Worker syntax check
        run: node --check experiments/article-delivery/r2-preview.mjs
