name: R2 image uploader safety test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/article-delivery-safe-preview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile uploaders
        run: python -m py_compile experiments/article-delivery/upload_images_r2.py experiments/article-delivery/upload_r2.py
      - name: Run article tests
        run: python -m unittest discover -s experiments/article-delivery -p 'test_*.py' -v
      - name: Image uploader dry-run on synthetic sample
        run: |
          mkdir -p /tmp/r2-image-test/images
          printf 'sample image bytes' > /tmp/r2-image-test/images/sample.jpg
          python experiments/article-delivery/upload_images_r2.py --dist /tmp/r2-image-test --manifest /tmp/r2-image-test/manifest.json
          python -c 'import json; x=json.load(open("/tmp/r2-image-test/manifest.json")); assert x["count"]==1 and x["files"][0]["key"]=="images/sample.jpg"'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker behavior tests
        run: node --test experiments/article-delivery/test_r2_preview.mjs
